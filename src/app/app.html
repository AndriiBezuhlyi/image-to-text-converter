<main class="converter-page">
  <section class="converter">
    <header class="converter-header">
      <h1>Image to Text Converter</h1>
      <p>Upload an image and extract text in seconds.</p>
    </header>

    <section class="upload-section">
      <h2>Upload Image</h2>

      <div class="upload-area">
        <input type="file" id="image-upload" accept="image/jpeg,image/png" (change)="onFileSelected()"/>

        <label for="image-upload"> Choose an image </label>

        <p>Supported formats: JPEG, PNG</p>
        <p>Maximum file size: 2 MB</p>
      </div>
    </section>

    <section class="preview-section">
      <h2>Image Preview</h2>

      <div class="preview-container">
        <p>No image selected</p>
      </div>
    </section>

    <section class="converter-actions">
      <button type="button" disabled>Extract Text</button>
    </section>

    <section class="result-section">
      <h2><label for="ExtractedText">Extracted Text</label></h2>

      <textarea
        placeholder="Recognized text will appear here..."
        id="ExtractedText"
        rows="8"
        readonly
      ></textarea>

      <div class="result-actions">
        <button type="button" disabled>Copy Text</button>

        <button type="button" disabled>Clear</button>
      </div>
    </section>
  </section>
</main>
